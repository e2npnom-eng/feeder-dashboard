name: Excel to data.js
on:
  push:
    paths: ["data/**.xlsx"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: convert-data
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install openpyxl && python convert.py data data.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "update data.js" && git pull --rebase -X theirs origin main && git push)
